name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 公开仓库守卫：本机绝对路径/本地路径协议依赖在 CI 不可解析，越早失败越好
      - run: sh scripts/check-local-paths.sh
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # lib/ 随仓库提交（克隆分发免构建）；若产物与 src 不一致，这里会显示为 diff
      - run: git diff --exit-code -- lib/ || (echo '::error::lib/ 产物与 src 不一致，请本地 pnpm build 后一并提交' && exit 1)
